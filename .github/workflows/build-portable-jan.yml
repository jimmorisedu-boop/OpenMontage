name: Build portable OpenMontage Jan

on:
  workflow_dispatch:
  push:
    branches:
      - codex/portable-jan-shell
    paths:
      - .github/workflows/build-portable-jan.yml
      - config/runtime/artifacts.json
      - integrations/jan/**

permissions:
  contents: write

concurrency:
  group: portable-openmontage-jan
  cancel-in-progress: true

jobs:
  build-portable-jan:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      JAN_TAG: v0.8.0
      JAN_COMMIT: 042bf6dc0c9a0a93baf66c8fe5bc2654f095258e
      RELEASE_TAG: openmontage-jan-v0.8.0
      ASSET_NAME: OpenMontage-Jan-v0.8.0.exe
    steps:
      - name: Checkout OpenMontage integration
        uses: actions/checkout@v4

      - name: Checkout pinned Jan source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/janhq/jan.git .jan-source
          git -C .jan-source checkout --detach $env:JAN_COMMIT
          $actual = git -C .jan-source rev-parse HEAD
          if ($actual -ne $env:JAN_COMMIT) {
            throw "Jan checkout mismatch: $actual"
          }

      - name: Apply OpenMontage patch
        shell: pwsh
        run: |
          git -C .jan-source apply --unidiff-zero --check "$env:GITHUB_WORKSPACE\integrations\jan\patches\0001-openmontage-shell.patch"
          git -C .jan-source apply --unidiff-zero "$env:GITHUB_WORKSPACE\integrations\jan\patches\0001-openmontage-shell.patch"

      - name: Configure Jan build tools
        shell: pwsh
        run: |
          node --version
          rustc --version
          cargo --version
          make --version
          $shimDir = Join-Path $env:RUNNER_TEMP 'corepack-bin'
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          corepack enable --install-directory $shimDir
          corepack prepare yarn@4.5.3 --activate
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$shimDir;$env:PATH"
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Test portable runtime patch
        shell: pwsh
        working-directory: .jan-source/src-tauri
        run: cargo test --lib portable

      - name: Build Jan
        shell: bash
        working-directory: .jan-source
        env:
          IS_CLEAN: "true"
          CI: "true"
        run: make build

      - name: Package portable executable
        shell: pwsh
        run: |
          $candidates = @(
            ".jan-source\src-tauri\target\release\Jan.exe",
            ".jan-source\src-tauri\target\release\jan.exe"
          )
          $source = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $source) { throw "Jan portable executable was not produced." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $source -Destination "dist\$env:ASSET_NAME"
          Copy-Item -LiteralPath integrations\jan\LICENSE.upstream -Destination dist\LICENSE.jan.txt
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\$env:ASSET_NAME").Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -Encoding ascii -LiteralPath "dist\$env:ASSET_NAME.sha256"
          [ordered]@{
            jan_tag = $env:JAN_TAG
            jan_commit = $env:JAN_COMMIT
            openmontage_commit = $env:GITHUB_SHA
            executable_sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath dist\build-manifest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-jan-v0.8.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish portable release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Portable OpenMontage Jan v0.8.0" --notes "Pinned Jan v0.8.0 shell for OpenMontage. Runtime inference remains local."
          }
          gh release upload $env:RELEASE_TAG "dist\$env:ASSET_NAME" "dist\$env:ASSET_NAME.sha256" "dist\build-manifest.json" "dist\LICENSE.jan.txt" --clobber

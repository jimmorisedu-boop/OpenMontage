<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenMontage</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#181818;background:#f7f7f5}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.side{padding:20px 14px;background:#efefec;border-right:1px solid #ddd}.brand{font-size:20px;font-weight:700;padding:0 10px 20px}.new{width:100%;padding:11px;border:1px solid #d3d3cf;background:#fff;border-radius:12px;text-align:left;font-size:14px}.hint{color:#777;font-size:12px;line-height:1.5;padding:20px 10px}.main{display:flex;flex-direction:column;min-width:0}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e6e6e2;background:#fafaf8}.title{font-weight:650}.mode{border:1px solid #ddd;background:white;border-radius:9px;padding:7px 10px}.messages{flex:1;overflow:auto;padding:28px max(24px,calc((100% - 850px)/2));scroll-behavior:smooth}.msg{max-width:82%;padding:12px 16px;border-radius:17px;margin:0 0 18px;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:#e8e8e4}.assistant{background:#fff;border:1px solid #e1e1dc}.composer-wrap{padding:12px max(24px,calc((100% - 900px)/2)) 24px}.materials{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.chip{background:#fff;border:1px solid #ddd;border-radius:10px;padding:7px 9px;font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.composer{background:white;border:1px solid #d7d7d1;border-radius:20px;padding:10px;box-shadow:0 8px 30px #0000000c}.composer textarea{width:100%;border:0;outline:0;resize:none;padding:8px;font:inherit;min-height:54px}.bar{display:flex;align-items:center;gap:8px}.attach,.send{border:0;border-radius:12px;padding:10px 14px;font-weight:600}.attach{background:#efefeb}.send{margin-left:auto;background:#ef6d4b;color:white}.status{font-size:12px;color:#777;padding-left:4px}.empty{text-align:center;color:#777;margin-top:18vh}.empty h1{color:#222;font-size:30px;margin-bottom:8px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.msg{max-width:95%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">OpenMontage</div><button class="new" onclick="newChat()">＋ Новый монтаж</button><div class="hint">Локальный монтажный чат<br><br>Видео, звук, сценарии, раскадровки и пояснения остаются на этом компьютере.</div></aside><main class="main"><header class="top"><div class="title">OpenMontage</div><select class="mode" id="mode"><option value="confirm">С подтверждением</option><option value="auto">Автономно</option><option value="read_only">Только чтение</option></select></header><section class="messages" id="messages"><div class="empty" id="empty"><h1>Что будем монтировать?</h1><div>Добавьте исходники и опишите желаемый результат.</div></div></section><div class="composer-wrap"><div class="materials" id="materials"></div><div class="composer"><textarea id="prompt" placeholder="Опишите задачу по монтажу…"></textarea><div class="bar"><button class="attach" onclick="pickMaterials()">＋ Добавить материалы</button><input id="picker" type="file" multiple accept="video/*,audio/*,image/*,.pdf,.doc,.docx,.txt,.md,.rtf,.csv,.xlsx,.pptx,.srt,.vtt,.ass,.json,.xml,.edl,.fcpxml,.aaf" webkitdirectory="false" hidden><span class="status" id="status">Всё обрабатывается локально</span><button class="send" id="send">Отправить ↑</button></div></div></div></main></div>
<script>
const messages=document.getElementById('messages'),empty=document.getElementById('empty'),picker=document.getElementById('picker'),materialsEl=document.getElementById('materials'),promptEl=document.getElementById('prompt'),statusEl=document.getElementById('status');let materials=[],history=[];
function renderMaterials(){materialsEl.innerHTML=materials.map((m,i)=>`<div class="chip" title="${m.path}">${m.kind==='video'?'🎬':m.kind==='audio'?'🎵':m.kind==='image'?'🖼️':'📄'} ${m.name} <b onclick="materials.splice(${i},1);renderMaterials()">×</b></div>`).join('')}
async function pickMaterials(){statusEl.textContent='Выбор файлов…';try{const data=await window.pywebview.api.pick_materials();const known=new Set(materials.map(x=>x.path));materials.push(...data.materials.filter(x=>!known.has(x.path)));renderMaterials()}catch(e){add('assistant','Не удалось добавить материалы: '+e.message)}finally{statusEl.textContent='Всё обрабатывается локально'}}
function add(role,text){empty?.remove();const d=document.createElement('div');d.className='msg '+role;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
async function send(){const text=promptEl.value.trim();if(!text)return;add('user',text);promptEl.value='';statusEl.textContent='Думаю…';document.getElementById('send').disabled=true;try{const data=await window.pywebview.api.chat({message:text,materials:materials.map(x=>x.path),mode:document.getElementById('mode').value,history});add('assistant',data.answer||'Готово');history.push({role:'user',content:text},{role:'assistant',content:data.answer||''});materials=[];renderMaterials()}catch(e){add('assistant','Ошибка: '+e.message)}finally{statusEl.textContent='Всё обрабатывается локально';document.getElementById('send').disabled=false}}
document.getElementById('send').onclick=send;promptEl.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};function newChat(){history=[];materials=[];messages.innerHTML='<div class="empty" id="empty"><h1>Что будем монтировать?</h1><div>Добавьте исходники и опишите желаемый результат.</div></div>';renderMaterials()}
</script></body></html>

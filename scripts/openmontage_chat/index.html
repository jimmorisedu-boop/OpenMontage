<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenMontage</title>
<style>
:root{font:100%/1.5 Inter,"Segoe UI",system-ui,sans-serif;color:#1d1d1b;background:#f6f6f3;--paper:#fff;--soft:#efefeb;--line:#deded8;--muted:#74746d;--accent:#ee6c4d;--accent-dark:#c94f34;--ok:#227a52;--warn:#9a641a}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.skip{position:fixed;left:8px;top:-60px;z-index:9;background:#fff;padding:8px}.skip:focus{top:8px}.app{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}.sidebar{background:#ecece8;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;min-height:0}.brand{font-size:21px;font-weight:750;padding:0 10px 16px}.new,.ghost,.secondary{border:1px solid #d2d2cb;background:#fff;border-radius:12px;padding:9px 12px}.new{text-align:left;font-weight:650}.section-label{margin:20px 10px 8px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}.projects-list{overflow:auto;display:grid;gap:6px}.project-row{border:0;background:transparent;border-radius:12px;padding:10px;text-align:left}.project-row:hover,.project-row.active{background:#fff}.project-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-row small{color:var(--muted)}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.header{padding:12px 24px;border-bottom:1px solid var(--line);background:#fafaf8;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.project-title{border:0;background:transparent;font-size:18px;font-weight:750}.project-path{font-size:12px;color:var(--muted);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-meta,.bar,.card-actions,.choices{display:flex;gap:8px;align-items:center}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:11px;padding:8px 12px;font-weight:650}.primary:hover{background:var(--accent-dark)}button:disabled{cursor:not-allowed;opacity:.5}.status-pill{font-size:12px;border-radius:999px;padding:5px 9px;background:var(--soft)}.messages{overflow:auto;padding:26px max(24px,calc((100% - 900px)/2))}.empty{text-align:center;color:var(--muted);margin-top:15vh}.empty h1{font-size:30px;color:#222;margin:0 0 8px}.msg,.card{max-width:880px;margin:0 0 16px;border-radius:17px;padding:12px 16px}.msg{white-space:pre-wrap}.msg.user{margin-left:auto;background:#e5e5e1;max-width:84%}.msg.assistant,.card{background:#fff;border:1px solid var(--line)}.card.inactive{opacity:.62}.question{padding:10px 0;border-top:1px solid #ecece8}.choices{flex-wrap:wrap;margin-top:8px}.choice{border:1px solid var(--line);background:#fafaf8;border-radius:10px;padding:8px 10px}.choice.selected{border-color:var(--accent);background:#fff2ed}.recommended{color:var(--accent-dark);font-size:11px;font-weight:700}.other{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px}.enhancement,.plan-step{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ecece8;padding:10px 0}.result-card{border-color:#b8d8c7}.result-path{font:12px ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-all}.blocker,.inline-error{border-color:#e2c6a2;background:#fffaf4}.operation{font-size:13px;color:var(--muted);padding:7px 0}.composer-wrap{padding:12px max(24px,calc((100% - 940px)/2)) 20px}.materials{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px}.composer{background:#fff;border:1px solid #d3d3cd;border-radius:20px;padding:10px;box-shadow:0 10px 35px #0000000d}.composer textarea{border:0;outline:0;resize:none;width:100%;min-height:54px;padding:8px}.attach{border:0;border-radius:11px;background:var(--soft);padding:9px 12px;font-weight:650}.send{margin-left:auto}.progress-status{color:var(--muted);font-size:12px}.approach{margin-top:10px;padding-top:9px;border-top:1px solid #ecece8;color:var(--muted);font-size:13px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ef9a82;outline-offset:2px}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.project-path{display:none}.messages{padding:18px 14px}.composer-wrap{padding:10px 14px}}
</style></head><body><a class="skip" href="#messages">К сообщениям</a><div class="app">
<aside class="sidebar"><div class="brand">OpenMontage</div><button class="new" id="new-project">＋ Новый монтаж</button><div class="section-label">Проекты</div><div class="projects-list" id="projects-list"></div></aside>
<main class="main"><header class="header"><div><input class="project-title" id="project-title" aria-label="Название проекта"><div class="project-path" id="project-path"></div></div><div class="project-meta"><span class="status-pill" id="project-status"></span><button class="ghost" id="open-folder">Открыть папку</button><select class="secondary" id="mode" aria-label="Режим работы"><option value="confirm">С подтверждением</option><option value="auto">Автономно</option><option value="read_only">Только чтение</option></select></div></header>
<section class="messages" id="messages" aria-live="polite" aria-busy="false"></section>
<div class="composer-wrap"><div id="inline-error" class="card inline-error" role="alert" hidden></div><div class="materials" id="materials"></div><div class="composer"><label for="prompt" class="visually-hidden">Задача по монтажу</label><textarea id="prompt" placeholder="Опишите результат или вставьте ссылку на материал…"></textarea><div class="bar"><button class="attach" id="attach">＋ Добавить материалы</button><span class="progress-status" id="status" aria-live="polite">Всё обрабатывается локально</span><button class="primary send" id="send">Отправить ↑</button></div></div></div></main></div>
<script>
const $=id=>document.getElementById(id),messages=$('messages'),projectsEl=$('projects-list'),materialsEl=$('materials'),promptEl=$('prompt'),statusEl=$('status');let active=null,materials=[],progressTimer=null,operationTimer=null,answersByProject={},enhancementAnswers={};const idle='Всё обрабатывается локально',progress=['Изучаю проект','Выбираю инструменты','Готовлю следующий шаг'];
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}function clear(el){while(el.firstChild)el.removeChild(el.firstChild)}function errorMessage(error){const el=$('inline-error');el.textContent='Не удалось выполнить действие: '+(error?.message||error);el.hidden=false}function clearError(){$('inline-error').hidden=true}function startProgress(){messages.setAttribute('aria-busy','true');let i=0;statusEl.textContent=progress[0];clearInterval(progressTimer);progressTimer=setInterval(()=>statusEl.textContent=progress[Math.min(++i,2)],4000)}function stopProgress(){messages.setAttribute('aria-busy','false');clearInterval(progressTimer);progressTimer=null;statusEl.textContent=idle}
const statusNames={needs_brief:'Нужны уточнения',ready_to_plan:'Формирую план',awaiting_approval:'Ждёт подтверждения',running:'В работе',needs_attention:'Нужно внимание',ready:'Готово'};
function renderProjects(list){clear(projectsEl);list.forEach(p=>{const b=node('button','project-row'+(active&&p.project_id===active.project_id?' active':''));b.append(node('strong','',p.title),node('small','',statusNames[p.status]||p.status));b.onclick=async()=>applyState(await window.pywebview.api.open_project(p.project_id));projectsEl.appendChild(b)})}function renderMaterials(){clear(materialsEl);materials.forEach(m=>materialsEl.appendChild(node('span','chip',(m.kind==='video'?'🎬 ':m.kind==='audio'?'🎵 ':m.kind==='image'?'🖼 ':'📄 ')+m.name))}
function textMessage(entry){const el=node('div','msg '+(entry.role==='user'?'user':'assistant'),entry.text||'');if(entry.role!=='user'&&entry.summary?.length){const details=node('details','approach'),title=node('summary','','Как я подошёл к задаче'),list=node('ul');entry.summary.slice(0,4).forEach(value=>list.appendChild(node('li','',value)));details.append(title,list);el.appendChild(details)}messages.appendChild(el)}
function questionCard(entry){const answers=answersByProject[active.project_id]||(answersByProject[active.project_id]={});const card=node('div','card question-card'+(entry.active===false?' inactive':''));card.append(node('h3','',entry.questions.length===1?'Нужно одно уточнение':'Уточните несколько деталей'));const submit=node('button','primary','Ответить');submit.disabled=true;entry.questions.slice(0,3).forEach(q=>{const wrap=node('div','question');wrap.append(node('strong','',q.text));const choices=node('div','choices');(q.choices||[]).slice(0,3).forEach(raw=>{const c=typeof raw==='string'?{value:raw,label:raw}:raw,b=node('button','choice',c.label);if(c.recommended)b.appendChild(node('span','recommended',' · Рекомендуем'));b.disabled=entry.active===false;b.onclick=()=>{answers[q.question_id]=c.value;[...choices.querySelectorAll('button')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');submit.disabled=!entry.questions.every(x=>answers[x.question_id])};choices.appendChild(b)});const other=node('input','other');other.placeholder='Другой ответ';other.disabled=entry.active===false;other.oninput=()=>{answers[q.question_id]=other.value.trim();submit.disabled=!entry.questions.every(x=>answers[x.question_id])};wrap.append(choices,other);card.appendChild(wrap)});const actions=node('div','card-actions');submit.onclick=()=>answerQuestions(entry.question_set_id,submit);actions.appendChild(submit);card.appendChild(actions);messages.appendChild(card)}
function enhancementCard(entry){const card=node('div','card enhancement-card'+(entry.active===false?' inactive':''));card.append(node('h3','','Можно улучшить результат'),node('p','','Необязательно; основной монтаж можно продолжить без этого.'));entry.enhancements.slice(0,3).forEach(e=>{const row=node('div','enhancement'),copy=node('div');copy.append(node('strong','',e.label),node('small','',e.benefit+' · '+e.cost));const apply=node('button','choice','Применить');apply.disabled=entry.active===false;apply.onclick=()=>{enhancementAnswers[e.enhancement_id]=true;apply.classList.add('selected')};row.append(copy,apply);card.appendChild(row)});const actions=node('div','card-actions'),go=node('button','primary','Продолжить'),skip=node('button','secondary','Пропустить');go.disabled=entry.active===false;skip.disabled=entry.active===false;go.onclick=()=>submitEnhancements(false);skip.onclick=()=>submitEnhancements(true);actions.append(go,skip);card.appendChild(actions);messages.appendChild(card)}
function planCard(entry){const plan=entry.plan||{},card=node('div','card plan-card'+(entry.active===false?' inactive':''));card.append(node('h3','','План монтажа'),node('p','',plan.summary||'План готов к запуску.'));(plan.steps||[]).forEach((s,i)=>{const row=node('div','plan-step');row.append(node('span','',String(i+1)+'. '+(s.label||s.tool)));card.appendChild(row)});const approve=node('button','primary','Подтвердить и запустить');approve.disabled=entry.active===false||plan.read_only;approve.onclick=()=>approvePlan(plan.plan_id,approve);const actions=node('div','card-actions');actions.appendChild(approve);card.appendChild(actions);messages.appendChild(card)}
function resultCard(entry){const a=entry.artifact||{},card=node('div','card result-card');card.append(node('h3','','Результат проверен'),node('p','',a.name||'Готовый файл'),node('div','result-path',a.path||''));const watch=node('button','primary','Смотреть'),folder=node('button','secondary','Открыть папку'),version=node('button','secondary','Новая версия');watch.onclick=()=>window.pywebview.api.open_artifact(active.project_id,a.artifact_id);folder.onclick=openFolder;version.onclick=newVersion;const actions=node('div','card-actions');actions.append(watch,folder,version);card.appendChild(actions);messages.appendChild(card)}
function renderConversation(entries){clear(messages);if(!entries.length){const e=node('div','empty');e.append(node('h1','','Что будем монтировать?'),node('div','','Добавьте материалы и опишите желаемый результат.'));messages.appendChild(e);return}entries.forEach(entry=>{if(entry.type==='text')textMessage(entry);else if(entry.type==='questions')questionCard(entry);else if(entry.type==='enhancements')enhancementCard(entry);else if(entry.type==='plan')planCard(entry);else if(entry.type==='result')resultCard(entry);else if(entry.type==='blocker'){const c=node('div','card blocker');c.append(node('h3','','Нужно внимание'),node('p','',entry.text));messages.appendChild(c)}else if(entry.type==='operation'){const icon=entry.status==='completed'?'✓':entry.status==='failed'?'!':'◌';messages.appendChild(node('div','operation',icon+' '+entry.label))}});messages.scrollTop=messages.scrollHeight}
function renderOperations(operations){(operations||[]).filter(o=>['queued','running','cancelling','interrupted','failed'].includes(o.status)).forEach(o=>{const card=node('div','card operation'),label=node('strong','',o.progress_label||'Выполняю монтаж'),status=node('p','',o.status==='running'?'В процессе…':o.status==='queued'?'В очереди':o.status==='interrupted'?'Можно продолжить':'Нужно внимание');card.append(label,status);if(['queued','running'].includes(o.status)){const cancel=node('button','secondary','Остановить');cancel.onclick=()=>window.pywebview.api.cancel_operation(o.operation_id);card.appendChild(cancel)}else if(o.can_resume){const resume=node('button','primary','Продолжить');resume.onclick=async()=>{try{const data=await window.pywebview.api.resume_operation(o.operation_id);applyState(data.project)}catch(e){errorMessage(e)}};card.appendChild(resume)}messages.appendChild(card)})}
function applyState(state){active=state;$('project-title').value=state.title;$('project-path').textContent=state.project_root;$('project-status').textContent=statusNames[state.status]||state.status;materials=(state.input_manifest?.inputs||[]).map(x=>({name:x.path.split(/[\\/]/).pop(),path:x.path,kind:x.media_type}));renderMaterials();renderConversation(state.conversation||[]);renderOperations(state.operations);renderProjects(state.projects||[]);monitorOperations(state.operations||[]);return state}
function monitorOperations(operations){clearTimeout(operationTimer);const current=operations.find(o=>['queued','running','cancelling'].includes(o.status));if(current)operationTimer=setTimeout(async()=>{try{const data=await window.pywebview.api.operation_status(current.operation_id);applyState(data.project)}catch(e){errorMessage(e)}},800)}
async function bootstrap(){const data=await window.pywebview.api.bootstrap();applyState(data.active_project);renderProjects(data.projects)}async function createProject(){applyState(await window.pywebview.api.create_project('Новый монтаж'))}async function pickMaterials(){if(!active)return;try{const data=await window.pywebview.api.pick_materials(active.project_id);if(data.project)applyState(data.project)}catch(e){errorMessage(e)}}async function send(){const text=promptEl.value.trim();if(!text||!active)return;clearError();startProgress();$('send').disabled=true;try{promptEl.value='';applyState(await window.pywebview.api.submit(active.project_id,text,$('mode').value))}catch(e){errorMessage(e)}finally{stopProgress();$('send').disabled=false}}async function answerQuestions(question_set_id,submit){const answers=answersByProject[active.project_id]||{};submit.disabled=true;startProgress();try{applyState(await window.pywebview.api.answer_questions(active.project_id,question_set_id,answers,$('mode').value));answersByProject[active.project_id]={}}catch(e){errorMessage(e);submit.disabled=false}finally{stopProgress()}}async function submitEnhancements(skip){startProgress();try{applyState(await window.pywebview.api.set_enhancements(active.project_id,skip?{}:enhancementAnswers,$('mode').value));enhancementAnswers={}}catch(e){errorMessage(e)}finally{stopProgress()}}async function approvePlan(plan_id,button){button.disabled=true;try{const data=await window.pywebview.api.approve_plan(active.project_id,plan_id,$('mode').value);applyState(data.project)}catch(e){errorMessage(e);button.disabled=false}}function openFolder(){return window.pywebview.api.open_project_folder(active.project_id)}async function newVersion(){applyState(await window.pywebview.api.create_version(active.project_id))}
$('new-project').onclick=createProject;$('attach').onclick=pickMaterials;$('send').onclick=send;$('open-folder').onclick=openFolder;$('project-title').onchange=async e=>applyState(await window.pywebview.api.rename_project(active.project_id,e.target.value));promptEl.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};window.addEventListener('pywebviewready',bootstrap);if(window.pywebview?.api)bootstrap();
</script></body></html>
